addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('cap');setTimeout(fit,100)}});
addEventListener('resize',()=>{if(map)fit()});
const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&autoload=false';

s.onerror=()=>{$('map').innerHTML='<div class="nomap">카카오 지도를 불러오지 못했습니다.<br>https://kinnjinuuan.github.io/aed-ansan/grid.html 주소로 열어주세요.</div>'};
document.head.appendChild(s);
